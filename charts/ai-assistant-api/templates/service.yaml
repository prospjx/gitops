apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-assistant-api.fullname" . }}-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.service.port }}"
    prometheus.io/path: "/metrics"
  labels:
    {{- include "ai-assistant-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ai-assistant-api.selectorLabels" . | nindent 4 }}
