apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-assistant-api.fullname" . }}-netpol
  labels:
    {{- include "ai-assistant-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-assistant-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow public HTTPS egress for Google Gemini API
    - ports:
        - protocol: TCP
          port: 443
    # Allow monitoring/logging egress
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3100
