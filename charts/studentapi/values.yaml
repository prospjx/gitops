replicaCount: 1

image:
  repository: ghcr.io/prospjx/student-api
  pullPolicy: IfNotPresent
  tag: "v15"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: "studentapi-deployment"
appLabel: "studentapi"

service:
  type: ClusterIP
  port: 8002
  targetPort: 8002
  name: studentapi-service

postgres:
  user: "postgres"
  database: "studentdb"
  password: "postgres"
  host: "postgres-service"
  port: 5432

configMap:
  name: studentapi-configmap

secret:
  name: studentapi-secret

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
