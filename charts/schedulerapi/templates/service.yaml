apiVersion: v1
kind: Service
metadata:
  name: {{ include "schedulerapi.fullname" . }}-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.service.port }}"
    prometheus.io/path: "/metrics"
  labels:
    {{- include "schedulerapi.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "schedulerapi.selectorLabels" . | nindent 4 }}
  ports:
    - name: schedulerapi-port
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
