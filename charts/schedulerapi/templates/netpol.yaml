apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "schedulerapi.fullname" . }}-netpol
  labels:
    {{- include "schedulerapi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "schedulerapi.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Microservices communication
    - to:
        - podSelector:
            matchLabels:
              app: courseapi
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: studentapi
      ports:
        - protocol: TCP
          port: 8002
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-assistant-api
      ports:
        - protocol: TCP
          port: 8003
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3100
