replicaCount: 1

image:
  repository: ghcr.io/prospjx/course-api
  pullPolicy: IfNotPresent
  tag: "v16"

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001

database:
  host: postgres-service
  port: 5432
  user: postgres
  name: coursedb
  password: postgres

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
